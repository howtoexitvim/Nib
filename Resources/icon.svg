<!-- Body: 824 on a 1024 canvas, with continuous-curve corners.
     Apple's icons are not rounded rectangles: the curvature ramps in
     smoothly rather than switching from a straight edge to a circular arc.
     The corners are superellipse sections (n=5.1, fitted against the real
     Notes icon) over straight edges covering 14% of each half-width.
     Tuned against the rendered PNG rather than the model, since the
     rasteriser and the hairline edge shift it: this lands a 170px inset,
     where Notes measures 174 and VS Code 171. The original arc corners
     measured 115, which is what made the icon read boxy beside every
     other app in the dock. -->
