<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nib</title>
    <link rel="stylesheet" href="./editor.css" />
  </head>
  <body>
    <!-- Exactly one of these is visible at a time. The preview is inert: no
         contenteditable, no input handlers, so there is no rendered mode in
         which ghost text could fire. -->
    <div id="pane">
      <div id="root"></div>
      <article id="preview" class="preview" tabindex="0" hidden></article>
    </div>
    <!-- Always visible, in both modes: it describes the document, not the view. -->
    <footer id="status" class="status"><span id="stats"></span></footer>
    <!-- Classic script, not a module: see build.mjs. -->
    <script src="./editor.js" defer></script>
  </body>
</html>
